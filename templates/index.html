{% extends "base.html" %}


{% block content %}
    <h1 class="mt-5">Book List</h1>


    <table class="table mt-3">
        <thead>
            <tr>
                <th>Title</th>
                <th>Author</th>
                <th>Acions</th>

            </tr>
        </thead>
        <tbody>
            {% for book in books %}
            <tr>
                <td><a href="">{{book.title}}</a></td>
                <td>{{book.author.name}}</td>
                <td>
                    <a href="/edit/{{book.id}}" class="btn btn-sm btn-primary" >Edit</a>
                    
                    <a href="{{url_for('delete_book',id=book.id)}}" class="btn btn-sm btn-danger">Delete</a>
                </td>
            </tr>
    
            {% endfor %}
        </tbody>
    </table>


{% endblock %}
